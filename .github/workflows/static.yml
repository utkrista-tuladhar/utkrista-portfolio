name: Deploy to GitHub Pages

on:
  # Manual only. Nothing deploys on push; run this from the Actions tab
  # and pick the branch you want published.
  workflow_dispatch:
    inputs:
      base_path:
        description: "Asset base path"
        required: true
        default: "/"
        type: choice
        options:
          # Custom domains serve from the root.
          - "/"
          # The github.io project URL needs the repo name prefix.
          - "/utkrista-portfolio/"

# Required by the native Pages deployment below.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from the packageManager field in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # Vite 7 requires Node 20.19+.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      # pnpm, not npm: package.json declares a patch for wouter under
      # pnpm.patchedDependencies, which npm ignores.
      # --no-frozen-lockfile because pnpm-lock.yaml currently lags package.json.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          BASE_PATH: ${{ inputs.base_path }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Must stay in step with deploy-pages below: an artifact written by an
      # older major is not readable by a newer one.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
